<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        RAG Document Q&A
    </title>

    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 800px;

            margin: 50px auto;

            padding: 20px;

            background: #f5f5f5;
        }

        .container {

            background: white;

            padding: 30px;

            border-radius: 10px;
        }

        input,
        button {

            padding: 10px;

            margin: 10px 0;
        }

        #question {

            width: 70%;
        }

        button {

            cursor: pointer;
        }

        #answerBox {

            margin-top: 30px;

            padding: 20px;

            background: #eeeeee;

            border-radius: 8px;

            display: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        RAG Document Q&A
    </h1>


    <!-- Upload Section -->

    <h2>
        1. Upload Document
    </h2>

    <input
        type="file"
        id="fileInput"
        accept=".txt"
    >

    <button onclick="uploadFile()">
        Upload
    </button>

    <p id="uploadStatus"></p>


    <hr>


    <!-- Question Section -->

    <h2>
        2. Ask Question
    </h2>

    <input
        type="text"
        id="question"
        placeholder="Ask something about your document..."
    >

    <button onclick="askQuestion()">
        Ask
    </button>


    <!-- Answer -->

    <div id="answerBox">

        <h3>
            Answer
        </h3>

        <p id="answer"></p>

        <h4>
            Sources
        </h4>

        <p id="sources"></p>

    </div>

</div>


<script>

async function uploadFile() {

    const fileInput =
        document.getElementById(
            "fileInput"
        );

    const file =
        fileInput.files[0];


    if (!file) {

        alert(
            "Please select a file."
        );

        return;
    }


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );


    const response =
        await fetch(
            "/upload",
            {

                method: "POST",

                body: formData

            }
        );


    const data =
        await response.json();


    document.getElementById(
        "uploadStatus"
    ).innerText =
        data.message ||
        data.error;

}


async function askQuestion() {

    const question =
        document.getElementById(
            "question"
        ).value;


    if (!question) {

        alert(
            "Please enter a question."
        );

        return;
    }


    const response =
        await fetch(
            "/ask",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    question: question

                })

            }
        );


    const data =
        await response.json();


    document.getElementById(
        "answerBox"
    ).style.display =
        "block";


    document.getElementById(
        "answer"
    ).innerText =
        data.answer;


    document.getElementById(
        "sources"
    ).innerText =
        data.sources.join(", ");

}

</script>

</body>

</html>
